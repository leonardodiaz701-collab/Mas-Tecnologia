<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+Tecnologia-Py | Catálogo de Créditos</title>
  
  <!-- Configuración PWA e Icono Directo -->
  <meta name="theme-color" content="#a3e635">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="+Tecnologia-Py">

  <!-- ICONO DIRECTO -->
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2586/2586488.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2586/2586488.png">

  <style>
    :root {
      --bg: #090d0a;
      --card-bg: #121a14;
      --card-border: #243628;
      --accent: #a3e635; /* Verde Limón */
      --accent-hover: #84cc16;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 40px;
    }

    /* BANNER ANIMADO */
    .ticker-wrap {
      background: #84cc16;
      color: #000;
      font-weight: 900;
      font-size: 0.82rem;
      padding: 8px 0;
      overflow: hidden;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .ticker-move {
      display: inline-block;
      animation: ticker 15s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translate3d(100%, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-svg {
      width: 26px;
      height: 26px;
      fill: var(--accent);
    }

    .brand h1 {
      font-size: 1.1rem;
      margin: 0;
      color: var(--accent);
      font-weight: 800;
    }

    .visit-badge {
      background: #17241a;
      border: 1px solid var(--accent);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: var(--accent);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn-action {
      background: var(--card-border);
      color: white;
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-install {
      background: var(--accent);
      color: #000;
      border: none;
    }

    .wrap {
      max-width: 800px;
      margin: 0 auto;
      padding: 15px;
    }

    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 100%;
      padding: 12px 15px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
    }

    .category-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--subtext);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
    }

    .category-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-img {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #080d09;
      border-radius: 8px;
      margin-bottom: 10px;
      padding: 5px;
    }

    .product-title {
      font-size: 1.1rem;
      margin: 0 0 5px 0;
      color: white;
      font-weight: 700;
    }

    .product-desc {
      font-size: 0.8rem;
      color: var(--subtext);
      margin-bottom: 12px;
    }

    .pricing-table {
      background: #17241a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #283d2c;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 4px 0;
    }

    .price-row b {
      color: var(--accent);
    }

    .btn-whatsapp {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      padding: 12px;
      width: 100%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn-delete {
      background: var(--danger);
      color: white;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 8px;
      width: 100%;
    }

    #adminPanel {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--subtext); margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 8px; background: #090d0a; border: 1px solid var(--card-border); border-radius: 6px; color: white;
    }

    .btn-submit {
      background: var(--accent); color: #000; font-weight: bold; border: none; padding: 10px; width: 100%; border-radius: 6px; cursor: pointer;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 25px;
      padding: 10px;
      line-height: 1.4;
      border-top: 1px dashed var(--card-border);
    }
  </style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker-move">
    🔥 ¡SOLICÍTALO SIN ENTREGA INICIAL! • MÍNIMOS REQUISITOS • EVALUACIÓN RÁPIDA POR WHATSAPP 🔥
  </div>
</div>

<header>
  <div class="brand">
    <svg class="brand-svg" viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>
    <h1>+Tecnologia-Py</h1>
  </div>

  <div class="visit-badge">
    👁️ <span id="visitCount">...</span> vistas
  </div>

  <div class="header-actions">
    <button class="btn-action" onclick="toggleAdmin()">⚙️ Admin</button>
    <button class="btn-action btn-install" onclick="instalarApp()">📱 Descargar</button>
  </div>
</header>

<div class="wrap">

  <div id="adminPanel">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
      <h2 style="font-size: 1rem; margin: 0; color: var(--accent);">Cargar Nuevo Producto</h2>
      <button onclick="cerrarAdmin()" style="background: var(--danger); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">Cerrar</button>
    </div>

    <form id="productForm" onsubmit="guardarProducto(event)">
      <div class="form-group">
        <label>Categoría:</label>
        <select id="pCategoria" required>
          <option value="celulares">Celulares</option>
          <option value="electro">Electrodomésticos</option>
          <option value="varios">Varios</option>
        </select>
      </div>

      <div class="form-group">
        <label>Marca y Modelo:</label>
        <input type="text" id="pNombre" placeholder="Ej: Samsung Galaxy A06" required>
      </div>

      <div class="form-group">
        <label>URL de la Imagen:</label>
        <input type="url" id="pImagen" placeholder="https://..." required>
      </div>

      <div class="form-group">
        <label>Especificaciones:</label>
        <textarea id="pDesc" rows="2" placeholder="Ej: 64GB Memoria, Pantalla 6.7''..." required></textarea>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
        <div class="form-group">
          <label>12 Cuotas:</label>
          <input type="text" id="pC12" placeholder="165.541 Gs." required>
        </div>
        <div class="form-group">
          <label>24 Cuotas:</label>
          <input type="text" id="pC24" placeholder="99.775 Gs." required>
        </div>
        <div class="form-group">
          <label>36 Cuotas:</label>
          <input type="text" id="pC36" placeholder="63.000 Gs." required>
        </div>
      </div>

      <button type="submit" class="btn-submit">Publicar en Catálogo</button>
    </form>
  </div>

  <div class="filter-bar">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar modelo o marca..." onkeyup="filtrarProductos()">
    <button class="category-btn active" onclick="filtrarCategoria('todos', this)">Todos</button>
    <button class="category-btn" onclick="filtrarCategoria('celulares', this)">Celulares</button>
    <button class="category-btn" onclick="filtrarCategoria('electro', this)">Electrodomésticos</button>
    <button class="category-btn" onclick="filtrarCategoria('varios', this)">Varios</button>
  </div>

  <div class="grid" id="productGrid"></div>

  <div class="disclaimer">
    * Todos los productos y cuotas están sujetos a análisis de crédito y modificaciones de precios según la entidad financiera.
  </div>

</div>

<script>
  const MI_WHATSAPP = "595971826300";
  const ADMIN_PASS = "admin123";
  let modoAdminActivado = false;

  const productosBase = [
    {
      id: 1,
      categoria: "celulares",
      nombre: "Samsung Galaxy A06 (64GB)",
      imagen: "https://images.unsplash.com/photo-1610945265064-0e34e5519bbf?w=400",
      descripcion: "Pantalla 6.7 HD+, Procesador Octa-Core, Cámara 50MP, Batería 5000mAh.",
      cuotas: { c12: "165.541 Gs.", c24: "99.775 Gs.", c36: "63.000 Gs." }
    },
    {
      id: 2,
      categoria: "celulares",
      nombre: "Samsung Galaxy A07 (64GB)",
      imagen: "https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400",
      descripcion: "Pantalla fluida 90Hz, 64GB memoria interna, Diseño ultrafino.",
      cuotas: { c12: "179.054 Gs.", c24: "108.207 Gs.", c36: "68.000 Gs." }
    },
    {
      id: 3,
      categoria: "celulares",
      nombre: "Samsung Galaxy A16 (128GB)",
      imagen: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400",
      descripcion: "128GB Almacenamiento, Pantalla AMOLED, Cámara Triple Profesional.",
      cuotas: { c12: "207.207 Gs.", c24: "125.773 Gs.", c36: "80.000 Gs." }
    },
    {
      id: 4,
      categoria: "celulares",
      nombre: "Samsung Galaxy A17 5G (128GB)",
      imagen: "https://images.unsplash.com/photo-1580910051074-3eb694886505?w=400",
      descripcion: "Conexión 5G Ultra Rápida, 128GB Memoria, Batería de carga rápida.",
      cuotas: { c12: "240.991 Gs.", c24: "146.852 Gs.", c36: "95.000 Gs." }
    }
  ];

  function obtenerProductos() {
    const almacenados = localStorage.getItem('tecnologia_py_productos_v2');
    return almacenados ? JSON.parse(almacenados) : productosBase;
  }

  function guardarProductosEnStorage(lista) {
    localStorage.setItem('tecnologia_py_productos_v2', JSON.stringify(lista));
  }

  let categoriaActual = 'todos';

  function renderizarProductos(lista) {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';

    if (lista.length === 0) {
      grid.innerHTML = '<p style="color:var(--subtext); text-align:center; grid-column:1/-1;">No hay productos disponibles en esta categoría.</p>';
      return;
    }

    lista.forEach(p => {
      const msg = encodeURIComponent(`Hola +Tecnologia-Py, estoy interesado en solicitar el *${p.nombre}* a cuotas (Sin Entrega Inicial). ¿Cuáles son los requisitos?`);
      const linkWa = `https://wa.me/${MI_WHATSAPP}?text=${msg}`;

      let botonBorrar = modoAdminActivado ? `<button class="btn-delete" onclick="eliminarProducto(${p.id})">🗑️ Eliminar Producto</button>` : '';

      grid.innerHTML += `
        <div class="product-card">
          <div>
            <img src="${p.imagen}" alt="${p.nombre}" class="product-img" onerror="this.src='https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400'">
            <h3 class="product-title">${p.nombre}</h3>
            <p class="product-desc">${p.descripcion}</p>
            
            <div class="pricing-table">
              <div class="price-row"><span>12 Cuotas:</span> <b>${p.cuotas.c12}</b></div>
              <div class="price-row"><span>24 Cuotas:</span> <b>${p.cuotas.c24}</b></div>
              <div class="price-row"><span>36 Cuotas:</span> <b>${p.cuotas.c36}</b></div>
            </div>
          </div>

          <a href="${linkWa}" target="_blank" class="btn-whatsapp">
            📲 Solicitar por WhatsApp
          </a>
          ${botonBorrar}
        </div>
      `;
    });
  }

  function filtrarProductos() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const productos = obtenerProductos();
    const filtrados = productos.filter(p => {
      const coincideCat = categoriaActual === 'todos' || p.categoria === categoriaActual;
      const coincideTexto = p.nombre.toLowerCase().includes(query) || p.descripcion.toLowerCase().includes(query);
      return coincideCat && coincideTexto;
    });
    renderizarProductos(filtrados);
  }

  function filtrarCategoria(cat, btn) {
    categoriaActual = cat;
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtrarProductos();
  }

  function toggleAdmin() {
    if (!modoAdminActivado) {
      const pass = prompt("Contraseña de Administrador:");
      if (pass === ADMIN_PASS) {
        modoAdminActivado = true;
        document.getElementById('adminPanel').style.display = 'block';
        filtrarProductos();
      } else if (pass !== null) {
        alert("Contraseña incorrecta.");
      }
    } else {
      document.getElementById('adminPanel').style.display = 'block';
    }
  }

  function cerrarAdmin() {
    document.getElementById('adminPanel').style.display = 'none';
  }

  function guardarProducto(e) {
    e.preventDefault();
    const productos = obtenerProductos();

    const nuevoProducto = {
      id: Date.now(),
      categoria: document.getElementById('pCategoria').value,
      nombre: document.getElementById('pNombre').value,
      imagen: document.getElementById('pImagen').value,
      descripcion: document.getElementById('pDesc').value,
      cuotas: {
        c12: document.getElementById('pC12').value,
        c24: document.getElementById('pC24').value,
        c36: document.getElementById('pC36').value
      }
    };

    productos.push(nuevoProducto);
    guardarProductosEnStorage(productos);
    
    alert("¡Producto publicado exitosamente!");
    document.getElementById('productForm').reset();
    filtrarProductos();
  }

  function eliminarProducto(id) {
    if (confirm("¿Eliminar este producto del catálogo?")) {
      let productos = obtenerProductos();
      productos = productos.filter(p => p.id !== id);
      guardarProductosEnStorage(productos);
      filtrarProductos();
    }
  }

  function cargarVisitas() {
    let visitasLocales = parseInt(localStorage.getItem('visitas_app') || '124');
    visitasLocales += 1;
    localStorage.setItem('visitas_app', visitasLocales);
    document.getElementById('visitCount').innerText = visitasLocales.toLocaleString();
  }

  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
  });

  function instalarApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
    } else {
      alert('Para instalar la App:\n1. Toca el menú de tu navegador (3 puntos).\n2. Elige "Agregar a la pantalla principal".');
    }
  }

  cargarVisitas();
  filtrarProductos();
</script>

</body>
</html>
